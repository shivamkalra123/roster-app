name: Deploy Roster App

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      AWS_REGION: ap-south-1
      ECR_REGISTRY: 530558031194.dkr.ecr.ap-south-1.amazonaws.com

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Backend
        run: |
          docker build -t $ECR_REGISTRY/roster-backend:latest ./backend
          docker push $ECR_REGISTRY/roster-backend:latest

      - name: Build Frontend
        run: |
          docker build -t $ECR_REGISTRY/roster-frontend:latest ./frontend
          docker push $ECR_REGISTRY/roster-frontend:latest

      - name: Build Admin
        run: |
          docker build -t $ECR_REGISTRY/roster-admin:latest ./admin
          docker push $ECR_REGISTRY/roster-admin:latest

      - name: Deploy Containers
        run: |
          cd ~/roster
          docker compose pull
          docker compose up -d --remove-orphans